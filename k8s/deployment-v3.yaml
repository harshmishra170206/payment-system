apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-v3
  template:
    metadata:
      labels:
        app: payment-v3
    spec:
      containers:
      - name: payment
        image: harshmishra1702/payment-system:v3
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: payment-v3-svc
spec:
  type: NodePort
  selector:
    app: payment-v3
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30003
